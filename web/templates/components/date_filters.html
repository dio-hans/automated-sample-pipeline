<div class="bg-white p-2 rounded-xl border border-stone-200 shadow-sm flex flex-wrap items-center justify-between gap-2 text-xs">
    
    <!-- PRESET QUICK FILTERS (READS Directly FROM request.GET) -->
    <div class="flex items-center gap-1 flex-wrap">
        <a href="?period=all" 
           class="px-3 py-1.5 rounded-lg font-medium transition-colors {% if request.GET.period == 'all' or not request.GET.period and not request.GET.from_date and not request.GET.to_date %}bg-[#00674F] text-white shadow-sm font-semibold{% else %}bg-stone-100 hover:bg-stone-200 text-stone-600{% endif %}">
            All
        </a>
        <a href="?period=this_week" 
           class="px-3 py-1.5 rounded-lg font-medium transition-colors {% if request.GET.period == 'this_week' %}bg-[#00674F] text-white shadow-sm font-semibold{% else %}bg-stone-100 hover:bg-stone-200 text-stone-600{% endif %}">
            This Week
        </a>
        <a href="?period=today" 
           class="px-3 py-1.5 rounded-lg font-medium transition-colors {% if request.GET.period == 'today' %}bg-[#00674F] text-white shadow-sm font-semibold{% else %}bg-stone-100 hover:bg-stone-200 text-stone-600{% endif %}">
            Today
        </a>
        <a href="?period=yesterday" 
           class="px-3 py-1.5 rounded-lg font-medium transition-colors {% if request.GET.period == 'yesterday' %}bg-[#00674F] text-white shadow-sm font-semibold{% else %}bg-stone-100 hover:bg-stone-200 text-stone-600{% endif %}">
            Yesterday
        </a>
        <a href="?period=this_month" 
           class="px-3 py-1.5 rounded-lg font-medium transition-colors {% if request.GET.period == 'this_month' %}bg-[#00674F] text-white shadow-sm font-semibold{% else %}bg-stone-100 hover:bg-stone-200 text-stone-600{% endif %}">
            This Month
        </a>
    </div>

    <!-- INLINE DATE RANGE PICKER -->
    <form method="get" class="flex items-center gap-2">
        <input type="hidden" name="period" value="custom">
        <div class="inline-flex items-center bg-stone-50 border border-stone-200 rounded-lg px-2.5 py-1 gap-1.5 text-stone-500">
            <span class="text-[10px] font-bold uppercase tracking-wider text-stone-400">From</span>
            <input type="date" 
                   name="from_date" 
                   value="{{ request.GET.from_date }}" 
                   onchange="this.form.submit()" 
                   class="bg-transparent border-0 p-0 text-xs text-stone-800 focus:ring-0 focus:outline-none cursor-pointer">
            
            <span class="text-stone-300">|</span>
            
            <span class="text-[10px] font-bold uppercase tracking-wider text-stone-400">To</span>
            <input type="date" 
                   name="to_date" 
                   value="{{ request.GET.to_date }}" 
                   onchange="this.form.submit()" 
                   class="bg-transparent border-0 p-0 text-xs text-stone-800 focus:ring-0 focus:outline-none cursor-pointer">
        </div>
        
        {% if request.GET.period == 'custom' or request.GET.from_date or request.GET.to_date %}
            <a href="?period=all" class="px-2 py-1 text-stone-400 hover:text-red-600 transition-colors text-xs font-semibold" title="Reset filter">
                <i class="fa-solid fa-xmark"></i>
            </a>
        {% endif %}
    </form>
</div>
