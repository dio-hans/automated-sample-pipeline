<form method="get"
      class="bg-white border border-line rounded-lg shadow-sm px-2.5 sm:px-3 py-2">

    <div class="flex flex-wrap items-center gap-1.5">

        <!-- QUICK PRESETS -->
        <a href="?period=today"
           class="px-2.5 py-1 rounded-md border text-[10px] font-semibold transition
           {% if preset == 'today' %}
               bg-olive text-white border-olive
           {% else %}
               bg-slate-50 text-slate-600 border-line hover:bg-slate-100
           {% endif %}">
            Today
        </a>

        <a href="?period=yesterday"
           class="px-2.5 py-1 rounded-md border text-[10px] font-semibold transition
           {% if preset == 'yesterday' %}
               bg-olive text-white border-olive
           {% else %}
               bg-slate-50 text-slate-600 border-line hover:bg-slate-100
           {% endif %}">
            Yesterday
        </a>

        <a href="?period=this_week"
           class="px-2.5 py-1 rounded-md border text-[10px] font-semibold transition
           {% if preset == 'this_week' %}
               bg-olive text-white border-olive
           {% else %}
               bg-slate-50 text-slate-600 border-line hover:bg-slate-100
           {% endif %}">
            This Week
        </a>

        <a href="?period=this_month"
           class="px-2.5 py-1 rounded-md border text-[10px] font-semibold transition
           {% if preset == 'this_month' %}
               bg-olive text-white border-olive
           {% else %}
               bg-slate-50 text-slate-600 border-line hover:bg-slate-100
           {% endif %}">
            This Month
        </a>

        <a href="?period=overall"
           class="px-2.5 py-1 rounded-md border text-[10px] font-semibold transition
           {% if preset == 'overall' %}
               bg-olive text-white border-olive
           {% else %}
               bg-slate-50 text-slate-600 border-line hover:bg-slate-100
           {% endif %}">
            Overall
        </a>


        <!-- CUSTOM RANGE -->
        <div class="w-full sm:w-auto sm:ml-auto
                    flex flex-wrap sm:flex-nowrap items-center gap-1.5
                    pt-2 sm:pt-0 mt-1 sm:mt-0
                    border-t sm:border-t-0 border-line">

            <div class="hidden lg:block h-4 border-r border-line mr-1"></div>

            <input type="hidden"
                   name="period"
                   value="custom">

            <!-- START DATE -->
            <div class="flex-1 min-w-[130px] sm:flex-none">

                <input
                    type="date"
                    name="start_date"
                    value="{{ period.start_date|date:'Y-m-d' }}"
                    class="w-full sm:w-auto h-8
                           rounded-md border border-line
                           px-2 text-[10px] sm:text-[11px]
                           text-slate-700 bg-white
                           focus:outline-none focus:border-olive"
                >

            </div>


            <span class="text-[10px] text-slate-400 font-medium shrink-0">
                to
            </span>


            <!-- END DATE -->
            <div class="flex-1 min-w-[130px] sm:flex-none">

                <input
                    type="date"
                    name="end_date"
                    value="{{ period.end_date|date:'Y-m-d' }}"
                    class="w-full sm:w-auto h-8
                           rounded-md border border-line
                           px-2 text-[10px] sm:text-[11px]
                           text-slate-700 bg-white
                           focus:outline-none focus:border-olive"
                >

            </div>


            <!-- APPLY -->
            <button
                type="submit"
                class="h-8 px-3 rounded-md
                       bg-slate-800 hover:bg-slate-900
                       text-white text-[10px] sm:text-[11px]
                       font-semibold transition shrink-0"
            >
                Apply
            </button>

        </div>

    </div>

</form>
