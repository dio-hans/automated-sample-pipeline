<form method="get" class="bg-white border border-gray-200 rounded shadow-sm p-1.5 px-2.5">
  <div class="flex flex-wrap items-center gap-1.5">
    
    <!-- Left Group: Quick Filter Presets -->
    <a href="?period=today"
       class="px-2.5 py-1 rounded border text-[11px] font-semibold transition
       {% if preset == 'today' %}
           bg-olive text-white border-olive
       {% else %}
           bg-gray-50 text-gray-600 border-gray-200 hover:bg-gray-100
       {% endif %}">
        Today
    </a>

    <a href="?period=yesterday"
       class="px-2.5 py-1 rounded border text-[11px] font-semibold transition
       {% if preset == 'yesterday' %}
           bg-olive text-white border-olive
       {% else %}
           bg-gray-50 text-gray-600 border-gray-200 hover:bg-gray-100
       {% endif %}">
        Yesterday
    </a>

    <a href="?period=this_week"
       class="px-2.5 py-1 rounded border text-[11px] font-semibold transition
       {% if preset == 'this_week' %}
           bg-olive text-white border-olive
       {% else %}
           bg-gray-50 text-gray-600 border-gray-200 hover:bg-gray-100
       {% endif %}">
        This Week
    </a>

    <a href="?period=this_month"
       class="px-2.5 py-1 rounded border text-[11px] font-semibold transition
       {% if preset == 'this_month' %}
           bg-olive text-white border-olive
       {% else %}
           bg-gray-50 text-gray-600 border-gray-200 hover:bg-gray-100
       {% endif %}">
        This Month
    </a>

    <a href="?period=overall"
       class="px-2.5 py-1 rounded border text-[11px] font-semibold transition
       {% if preset == 'overall' %}
           bg-olive text-white border-olive
       {% else %}
           bg-gray-50 text-gray-600 border-gray-200 hover:bg-gray-100
       {% endif %}">
        Overall
    </a>

    <!-- Right Group: Custom Date Filters (Pushed to Far Right with ml-auto) -->
    <div class="flex items-center gap-1.5 sm:ml-auto pt-1 sm:pt-0 border-t sm:border-t-0 border-gray-100 w-full sm:w-auto">
      <div class="hidden lg:block h-4 border-r border-gray-200 mr-1"></div>
      <input type="hidden" name="period" value="custom">
      
      <input
          type="date"
          name="start_date"
          value="{{ period.start_date|date:'Y-m-d' }}"
          class="rounded border border-gray-200 px-2 py-0.5 text-[11px] text-gray-700 focus:outline-none focus:border-gray-400"
      >
      <span class="text-[11px] text-gray-400 font-medium">to</span>
      <input
          type="date"
          name="end_date"
          value="{{ period.end_date|date:'Y-m-d' }}"
          class="rounded border border-gray-200 px-2 py-0.5 text-[11px] text-gray-700 focus:outline-none focus:border-gray-400"
      >
      
      <button
          type="submit"
          class="px-3 py-1 rounded bg-gray-900 hover:bg-gray-800 text-white text-[11px] font-semibold transition"
      >
          Apply
      </button>
    </div>

  </div>
</form>
